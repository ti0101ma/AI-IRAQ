<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قناة الخاصة رقم 1 في العراق</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #f8fafc;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="pin-screen">
        <h1>الوصول مقيد</h1>
        <p>أدخل رمز الوصول (PIN) للمتابعة إلى القناة</p>
        <input type="password" id="pin-input" placeholder="أدخل الرمز" maxlength="4">
        <button onclick="checkPin()">دخول</button>
        <div class="error" id="pin-error">رمز الوصول غير صحيح</div>
    </div>

    <div class="container hidden" id="main-screen">
        <h1>قناة الخاصة رقم 1 في العراق 🇮🇶</h1>
        <p>
            💸 اربح ما يصل إلى 150,000 دينار عراقي<br>
            📊 إشارات في الوقت الفعلي<br>
            🔓 الوصول مجاني اليوم
        </p>
        <button onclick="openTelegram()">فتح في تيليجرام</button>
    </div>

    <script>
        const CORRECT_PIN = "2282";
        const REF_URL = "https://reffpa.com/L?tag=d_5703442m_18217c_&site=5703442&ad=18217&r=registration";

        function checkPin() {
            const pin = document.getElementById("pin-input").value;
            const error = document.getElementById("pin-error");
            
            if (pin === CORRECT_PIN) {
                document.getElementById("pin-screen").classList.add("hidden");
                document.getElementById("main-screen").classList.remove("hidden");
            } else {
                error.style.display = "block";
            }
        }

        function openTelegram() {
            window.location.href = REF_URL;
        }
    </script>

</body>
</html>
